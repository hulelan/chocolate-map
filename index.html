<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cacao Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --farm: #4caf50;
      --facility: #e08a3c;
      --coll: #7b4a1e;
      --bg: #1f1a17;
      --panel: #2a2320;
      --panel-2: #352c27;
      --text: #f3ece7;
      --muted: #b7a99f;
      --border: #443a34;
      --accent: #d98e3b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); }
    #app { display: flex; height: 100vh; overflow: hidden; }

    #sidebar { width: 320px; min-width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
    #sidebar header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
    #sidebar header h1 { margin: 0; font-size: 18px; }
    #sidebar header p { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

    .toolbar { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; cursor: pointer; font: inherit; font-size: 13px; text-decoration: none; text-align: center; }
    .btn:hover { border-color: var(--accent); }
    .btn.wide { display: block; width: 100%; }
    #search { width: 100%; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; font-size: 13px; }
    #search::placeholder { color: var(--muted); }

    .filters { display: flex; gap: 12px; padding: 10px 18px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .filters label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.farm { background: var(--farm); }
    .dot.facility { background: var(--facility); }
    .dot.coll { background: var(--coll); border-radius: 3px; }

    #list { flex: 1; overflow-y: auto; padding: 8px 12px 40px; }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 20px; }
    .card { background: var(--panel-2); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .card:hover { border-color: var(--accent); }
    .card.farm { border-left-color: var(--farm); }
    .card.facility { border-left-color: var(--facility); }
    .card .name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
    .card .meta { font-size: 11px; color: var(--muted); }
    .card .note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    #map { flex: 1; height: 100%; }
    .leaflet-control-layers { background: var(--panel) !important; color: var(--text); border: 1px solid var(--border) !important; border-radius: 8px !important; }
    .leaflet-control-layers-toggle { filter: invert(0.9); }
    .leaflet-control-layers label { font-size: 13px; }
    .leaflet-bar a { background: var(--panel); color: var(--text); border-bottom-color: var(--border); }
    .leaflet-bar a:hover { background: var(--panel-2); }

    .leaflet-popup-content { margin: 12px 14px; min-width: 220px; }
    .pop-title { font-weight: 700; font-size: 15px; color: #222; }
    .pop-type { font-size: 11px; color: #777; margin: 2px 0 8px; }
    .pop-note { font-size: 12px; color: #444; margin-bottom: 8px; line-height: 1.4; }
    .pop-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .pf-btn { border: none; border-radius: 6px; padding: 6px 11px; cursor: pointer; font-size: 13px; background: #2e6da4; text-decoration: none; }
    .leaflet-popup-content a.pf-btn { color: #fff; }
    .pf-btn.alt { background: #eee; }
    .leaflet-popup-content a.pf-btn.alt { color: #333; }

    /* Collection pins: one marker per origin, number = bars from there */
    .coll-pin { background: var(--coll); color: #fff; border: 2px solid #f3d9b8; border-radius: 6px; font: 700 11px/1 -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .coll-head { font-size: 12px; font-weight: 600; color: #222; margin: 8px 0 2px; }
    .coll-pop { max-height: 260px; overflow-y: auto; }
    .coll-item { display: flex; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee; text-decoration: none; font-size: 12px; line-height: 1.3; }
    .leaflet-popup-content a.coll-item { color: #222; }
    .coll-item:hover { background: #f6efe8; }
    .coll-item img { width: 32px; height: 42px; object-fit: cover; border-radius: 3px; flex: none; background: #eee; }
    .coll-item .x { margin-left: auto; font-weight: 700; color: var(--coll); padding-left: 6px; }
    .coll-item .m { color: #777; }

    /* Pin page */
    .detail { position: fixed; inset: 0; z-index: 2000; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
    .detail[hidden] { display: none; }
    .detail-top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .d-crumb { font-size: 13px; color: var(--muted); flex: 1; }
    .d-crumb b { color: var(--text); }
    .detail-body { flex: 1; display: grid; grid-template-columns: 1fr 420px; overflow: hidden; }
    .detail-main { padding: 24px 32px; overflow-y: auto; }
    .detail-side { border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; background: var(--panel); }
    .d-name { font-size: 28px; font-weight: 700; margin: 4px 0; }
    .d-type { font-size: 12px; color: var(--muted); margin-bottom: 20px; display: flex; align-items: center; gap: 6px; }
    .d-section { font-size: 12px; color: var(--muted); margin: 22px 0 8px; }
    .d-notes { font-size: 15px; line-height: 1.65; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
    .d-notes a { color: var(--accent); }
    .d-notes p { margin: 0.6em 0; }
    .d-bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .d-bar { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px; color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.3; }
    .d-bar:hover { border-color: var(--accent); }
    .d-bar img { width: 40px; height: 52px; object-fit: cover; border-radius: 4px; flex: none; background: var(--panel-2); }
    .d-bar .m { color: var(--muted); font-size: 12px; }
    .d-map { width: 100%; height: 300px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 16px; }
    .d-coords { font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-variant-numeric: tabular-nums; }
    .d-links a { display: block; margin-top: 8px; color: var(--accent); font-size: 13px; }

    @media (max-width: 820px) { .detail-body { grid-template-columns: 1fr; } .detail-side { border-left: none; border-top: 1px solid var(--border); } }
    @media (max-width: 720px) { #app { flex-direction: column; } #sidebar { width: 100%; min-width: 0; height: 42%; } #map { height: 58%; } }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>Cacao Map</h1>
        <p>Cacao farms, chocolate makers, and where the bars in my collection come from.</p>
      </header>

      <div class="toolbar">
        <a class="btn wide" href="collection.html">Collection table</a>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search farms and makers" />
      </div>

      <div class="filters">
        <label><input type="checkbox" id="f-farm" checked /><span class="dot farm"></span> Farms</label>
        <label><input type="checkbox" id="f-facility" checked /><span class="dot facility"></span> Makers</label>
        <label><input type="checkbox" id="f-coll" checked /><span class="dot coll"></span> Collection</label>
      </div>

      <div id="list"></div>
    </aside>

    <div id="map"></div>
  </div>

  <div id="detail" class="detail" hidden>
    <div class="detail-top">
      <button class="btn" id="d-back">Back to map</button>
      <div class="d-crumb" id="d-crumb"></div>
      <button class="btn" id="d-locate">Show on map</button>
    </div>
    <div class="detail-body">
      <div class="detail-main">
        <div class="d-name" id="d-name"></div>
        <div class="d-type"><span class="dot" id="d-type-dot"></span><span id="d-type"></span></div>
        <div id="d-notes" class="d-notes"></div>
        <div id="d-bars-wrap" hidden>
          <div class="d-section" id="d-bars-head"></div>
          <div id="d-bars" class="d-bars"></div>
        </div>
      </div>
      <div class="detail-side">
        <div id="d-map" class="d-map"></div>
        <div class="d-coords" id="d-coords"></div>
        <div class="d-links">
          <a id="d-gmaps" target="_blank" rel="noopener">Google Maps</a>
          <a id="d-osm" target="_blank" rel="noopener">OpenStreetMap</a>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    'use strict';

    const rootStyle = getComputedStyle(document.documentElement);
    const TYPES = {
      farm: { label: 'Farm', color: rootStyle.getPropertyValue('--farm').trim() },
      facility: { label: 'Maker', color: rootStyle.getPropertyValue('--facility').trim() },
    };

    let pins = [];          // data/pins.json
    let collection = [];    // data/collection.json
    const barsByPin = new Map();   // pin id -> collection records (record.pins is set by scripts/build_collection.py)

    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    const el = (id) => document.getElementById(id);

    /* ---------- Base map ---------- */
    const ESRI_ATTR = 'Imagery &copy; <a href="https://www.esri.com">Esri</a>, Maxar, Earthstar Geographics, USDA, USGS, and the GIS User Community';
    function esriTiles(service, opts) {
      return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/' + service + '/MapServer/tile/{z}/{y}/{x}',
        Object.assign({ maxZoom: 21, maxNativeZoom: 19 }, opts || {}));
    }
    const hybrid = L.layerGroup([esriTiles('World_Imagery', { attribution: ESRI_ATTR }), esriTiles('Reference/World_Transportation', {}), esriTiles('Reference/World_Boundaries_and_Places', {})]);
    const baseLayers = {
      'Satellite with labels': hybrid,
      'Satellite': esriTiles('World_Imagery', { attribution: ESRI_ATTR }),
      'Streets': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }),
      'Terrain': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 17, attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>' }),
    };
    const map = L.map('map', { worldCopyJump: true, maxZoom: 21, layers: [hybrid] }).setView([15, 0], 3);
    L.control.layers(baseLayers, null, { position: 'topright', collapsed: false }).addTo(map);

    /* ---------- Farm and maker pins ---------- */
    const markers = new Map();
    function makeIcon(type) {
      const color = (TYPES[type] || TYPES.farm).color;
      return L.divIcon({
        className: '',
        html: '<div style="width:20px;height:20px;border-radius:50% 50% 50% 0;background:' + color + ';border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,0.6);"></div>',
        iconSize: [20, 20], iconAnchor: [10, 20], popupAnchor: [0, -20],
      });
    }

    function uniqueBars(records) {
      const g = new Map();
      for (const r of records) { const k = r['Brand'] + '|' + r['Bar name']; if (!g.has(k)) g.set(k, []); g.get(k).push(r); }
      return [...g.values()];
    }
    function barsLabel(pin, n) { return n + (n === 1 ? ' bar' : ' bars') + (pin.type === 'facility' ? ' by this maker' : ' from this origin'); }

    function pinPopup(pin) {
      const wrap = document.createElement('div');
      const bars = barsByPin.get(pin.id) || [];
      wrap.innerHTML =
        '<div class="pop-title">' + escapeHtml(pin.name) + '</div>' +
        '<div class="pop-type">' + TYPES[pin.type].label + '</div>' +
        (pin.notes ? '<div class="pop-note">' + escapeHtml(pin.notes.split('\n')[0]) + '</div>' : '') +
        '<div class="pop-actions">' +
          (bars.length ? '<a class="pf-btn" href="collection.html?pin=' + encodeURIComponent(pin.id) + '">' + escapeHtml(barsLabel(pin, bars.length)) + '</a>' : '') +
          '<a class="pf-btn alt" href="#/pin/' + encodeURIComponent(pin.id) + '">Details</a>' +
        '</div>';
      return wrap;
    }

    const searchEl = el('search');
    function visible(pin) { return el(pin.type === 'facility' ? 'f-facility' : 'f-farm').checked; }
    function renderList() {
      const q = searchEl.value.trim().toLowerCase();
      const shown = pins.filter(p => visible(p) && (!q || (p.name + ' ' + (p.notes || '')).toLowerCase().includes(q)))
        .sort((a, b) => a.name.localeCompare(b.name));
      const listEl = el('list');
      if (!shown.length) { listEl.innerHTML = '<div class="empty">No matches.</div>'; return; }
      listEl.innerHTML = '';
      for (const pin of shown) {
        const n = (barsByPin.get(pin.id) || []).length;
        const card = document.createElement('div');
        card.className = 'card ' + pin.type;
        card.innerHTML =
          '<div class="name">' + escapeHtml(pin.name) + '</div>' +
          '<div class="meta">' + TYPES[pin.type].label + (n ? ' · ' + escapeHtml(barsLabel(pin, n)) : '') + '</div>' +
          (pin.notes ? '<div class="note">' + escapeHtml(pin.notes.split('\n')[0]) + '</div>' : '');
        card.onclick = () => { map.setView([pin.lat, pin.lng], Math.max(map.getZoom(), 8)); markers.get(pin.id).openPopup(); };
        listEl.appendChild(card);
      }
    }
    function applyFilter() {
      for (const pin of pins) {
        const m = markers.get(pin.id);
        if (visible(pin)) { if (!map.hasLayer(m)) m.addTo(map); } else if (map.hasLayer(m)) map.removeLayer(m);
      }
      renderList();
    }
    el('f-farm').onchange = applyFilter;
    el('f-facility').onchange = applyFilter;
    searchEl.oninput = renderList;

    /* ---------- Pin page (#/pin/<id>) ---------- */
    let current = null, detailMap = null, detailMarker = null;
    function linkify(text) {
      return escapeHtml(text).split(/\n{2,}/).map(p => '<p>' + p.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>') + '</p>').join('');
    }
    function openDetail(id) {
      const pin = pins.find(p => p.id === id);
      if (!pin) { location.hash = ''; return; }
      current = pin;
      el('detail').hidden = false;
      el('d-crumb').innerHTML = 'Cacao Map / <b>' + escapeHtml(pin.name) + '</b>';
      el('d-name').textContent = pin.name;
      el('d-type').textContent = TYPES[pin.type].label;
      el('d-type-dot').style.background = TYPES[pin.type].color;
      el('d-notes').innerHTML = pin.notes ? linkify(pin.notes) : '<p>No notes.</p>';

      const groups = uniqueBars(barsByPin.get(pin.id) || []);
      el('d-bars-wrap').hidden = !groups.length;
      if (groups.length) {
        const total = groups.reduce((n, g) => n + g.length, 0);
        el('d-bars-head').textContent = barsLabel(pin, total) + (groups.length !== total ? ' (' + groups.length + ' different)' : '');
        el('d-bars').innerHTML = groups.map(copies => {
          const r = copies[0];
          return '<a class="d-bar" href="collection.html?bar=' + encodeURIComponent(r.id) + '">' +
            (r.photos && r.photos[0] ? '<img loading="lazy" alt="" src="collection/thumb/' + encodeURIComponent(r.photos[0]) + '"/>' : '') +
            '<span><b>' + escapeHtml(r['Bar name']) + '</b><br><span class="m">' + escapeHtml(r['Brand']) +
            (copies.length > 1 ? ' · ' + copies.length + ' copies' : '') + '</span></span></a>';
        }).join('');
      }

      el('d-coords').textContent = pin.lat.toFixed(5) + ', ' + pin.lng.toFixed(5);
      el('d-gmaps').href = 'https://www.google.com/maps/search/?api=1&query=' + pin.lat + ',' + pin.lng;
      el('d-osm').href = 'https://www.openstreetmap.org/?mlat=' + pin.lat + '&mlon=' + pin.lng + '#map=14/' + pin.lat + '/' + pin.lng;
      if (!detailMap) {
        detailMap = L.map('d-map', { maxZoom: 21, attributionControl: false });
        L.layerGroup([esriTiles('World_Imagery', {}), esriTiles('Reference/World_Boundaries_and_Places', {})]).addTo(detailMap);
        detailMarker = L.marker([0, 0]).addTo(detailMap);
      }
      detailMarker.setLatLng([pin.lat, pin.lng]);
      detailMap.setView([pin.lat, pin.lng], 14);
      setTimeout(() => detailMap.invalidateSize(), 60);
    }
    function closeDetail() { el('detail').hidden = true; current = null; }
    el('d-back').onclick = () => { location.hash = ''; };
    el('d-locate').onclick = () => {
      const p = current; location.hash = '';
      map.setView([p.lat, p.lng], Math.max(map.getZoom(), 10));
      setTimeout(() => markers.get(p.id).openPopup(), 250);
    };
    function router() {
      const m = location.hash.match(/^#\/pin\/(.+)$/);
      if (m) openDetail(decodeURIComponent(m[1])); else closeDetail();
    }
    window.addEventListener('hashchange', router);

    /* ---------- Collection layer ---------- */
    const collLayer = L.layerGroup().addTo(map);
    const collByBar = new Map();   // record id -> marker, for ?bar= links from the table
    function collIcon(n) {
      const s = n > 9 ? 28 : 24;
      return L.divIcon({ className: '', html: '<div class="coll-pin" style="width:' + s + 'px;height:' + s + 'px;">' + n + '</div>', iconSize: [s, s], iconAnchor: [s / 2, s / 2], popupAnchor: [0, -s / 2] });
    }
    function collPopup(pt) {
      const wrap = document.createElement('div');
      const prec = pt.precision === 'country' ? 'Placed at the country centre' : pt.precision === 'region' ? 'Placed at the region' : '';
      wrap.innerHTML =
        '<div class="pop-title">' + escapeHtml(pt.place) + '</div>' +
        '<div class="pop-type">' + pt.items.length + (pt.items.length === 1 ? ' bar' : ' bars') + ' from this origin' + (prec ? ' · ' + prec : '') + '</div>' +
        '<div class="coll-pop">' + uniqueBars(pt.items).map(copies => {
          const r = copies[0];
          return '<a class="coll-item" href="collection.html?bar=' + encodeURIComponent(r.id) + '">' +
            (r.photos && r.photos[0] ? '<img loading="lazy" alt="" src="collection/thumb/' + encodeURIComponent(r.photos[0]) + '"/>' : '') +
            '<span><b>' + escapeHtml(r['Bar name']) + '</b><br><span class="m">' + escapeHtml(r['Brand']) + (r['Cacao %'] ? ' · ' + escapeHtml(r['Cacao %']) + '%' : '') + '</span></span>' +
            (copies.length > 1 ? '<span class="x">' + copies.length + '</span>' : '') + '</a>';
        }).join('') + '</div>' +
        '<div class="pop-actions"><a class="pf-btn" href="collection.html?place=' + encodeURIComponent(pt.place) + '">Open in table</a></div>';
      return wrap;
    }
    function drawCollection() {
      const pts = new Map();
      for (const r of collection) {
        if (typeof r.lat !== 'number' || typeof r.lng !== 'number') continue;
        const k = r.lat + ',' + r.lng;
        if (!pts.has(k)) pts.set(k, { lat: r.lat, lng: r.lng, place: r.place, precision: r.precision, items: [] });
        pts.get(k).items.push(r);
      }
      for (const pt of pts.values()) {
        const m = L.marker([pt.lat, pt.lng], { icon: collIcon(pt.items.length), title: pt.place, zIndexOffset: -100 }).addTo(collLayer);
        m.bindPopup(() => collPopup(pt), { minWidth: 250, maxWidth: 300 });
        pt.items.forEach(r => collByBar.set(r.id, m));
      }
    }
    el('f-coll').onchange = (e) => { e.target.checked ? collLayer.addTo(map) : map.removeLayer(collLayer); };

    /* ---------- Init ---------- */
    async function getJson(url) {
      try { const res = await fetch(url, { cache: 'no-store' }); return res.ok ? await res.json() : []; } catch { return []; }
    }
    async function init() {
      [pins, collection] = await Promise.all([getJson('data/pins.json'), getJson('data/collection.json')]);
      for (const r of collection) for (const id of r.pins || []) { if (!barsByPin.has(id)) barsByPin.set(id, []); barsByPin.get(id).push(r); }
      for (const pin of pins) {
        const m = L.marker([pin.lat, pin.lng], { icon: makeIcon(pin.type), title: pin.name }).addTo(map);
        m.bindPopup(() => pinPopup(pin), { minWidth: 230 });
        markers.set(pin.id, m);
      }
      drawCollection();
      renderList();
      router();
      const focus = new URLSearchParams(location.search).get('bar');
      if (focus && collByBar.has(focus)) { const m = collByBar.get(focus); map.setView(m.getLatLng(), 6); m.openPopup(); }
    }
    init();
  </script>
</body>
</html>
